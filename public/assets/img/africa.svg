<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" fill="none">
  <defs>
    <linearGradient id="afGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00B4D8"/>
      <stop offset="100%" stop-color="#0077B6"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Simplified Africa continent silhouette -->
  <path d="M198 20
           C 230 30, 270 45, 295 75
           C 320 105, 335 130, 340 160
           C 345 185, 335 210, 320 230
           C 305 250, 300 270, 305 295
           C 310 320, 300 350, 285 375
           C 270 400, 245 420, 225 440
           C 215 450, 205 460, 195 465
           C 180 460, 170 445, 165 430
           C 155 405, 145 385, 130 370
           C 110 350, 95 330, 90 305
           C 85 280, 90 255, 85 235
           C 80 215, 65 195, 60 175
           C 55 150, 70 125, 95 105
           C 120 85, 145 70, 165 55
           C 175 45, 185 30, 198 20 Z"
        fill="url(#afGrad)"
        stroke="#90E0EF"
        stroke-width="2"
        filter="url(#glow)"/>

  <!-- Madagascar island -->
  <path d="M330 340
           C 340 350, 345 365, 340 380
           C 335 390, 325 395, 318 388
           C 312 380, 312 365, 318 352
           C 322 345, 326 340, 330 340 Z"
        fill="url(#afGrad)"
        stroke="#90E0EF"
        stroke-width="1.5"
        opacity="0.9"/>

  <!-- Pulsing dot at center (Tanzania area) -->
  <circle cx="240" cy="290" r="6" fill="#FFC107">
    <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="240" cy="290" r="14" stroke="#FFC107" stroke-width="2" fill="none" opacity="0.6">
    <animate attributeName="r" values="14;30" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0" dur="2s" repeatCount="indefinite"/>
  </circle>
</svg>
